services:
  api:
    image: api
    container_name: fg-project-api
    build:
      context: .
      dockerfile: API/Dockerfile
    ports:
      - "5000:5000"
      - "5001:5001"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: fg-project-db-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      

volumes:
  postgres_data:

